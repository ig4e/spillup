name: release

# Push a tag like v0.2.0 to publish binaries for every platform, with checksums.txt.
# The nightly workflow calls this one with a prerelease tag.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the dashboard
        run: npm --prefix web ci && npm --prefix web run build
      - run: go test -count=1 ./...
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir release
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
              -o "release/spinup_${os}_${arch}${ext}" ./cmd/spinup
          done
          cd release && sha256sum * > checksums.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" release/* --title "spillup $TAG" --notes-file "${GITHUB_WORKSPACE}/.github/release-notes.md" --generate-notes --verify-tag "${flags[@]}"
